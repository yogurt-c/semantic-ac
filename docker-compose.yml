services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  search-server:
    build:
      context: ./packages/server
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /data/search_events.duckdb
      # 자사 서비스에 붙일 때는 프런트엔드 도메인으로 좁혀서 지정할 것
      # (예: https://shop.example.com,https://m.shop.example.com)
      ALLOWED_ORIGINS: "*"
    volumes:
      - duckdb-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/suggest?q=healthcheck')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # 트랙 C: 상시 서빙 경로와 리소스 경합 없이 주기적으로 실행되는 원샷 배치 워커
  # (TODO.md 0번 결정). 기본값(EMBEDDING_PROVIDER=hashing, KEYWORD_GENERATOR_PROVIDER=noop)은
  # HashingEmbeddingModel/NoopKeywordGenerator placeholder로 파이프라인 구조만 검증한다.
  ai-worker:
    build:
      context: ./packages/ai-engine
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /data/search_events.duckdb
      INDEX_PATH: /data/faiss/index.faiss
      BATCH_INTERVAL_SECONDS: "60"
      # 추천 생성 방식 튜닝(전부 선택, 미설정 시 코드 기본값 사용). 상세 설명은
      # packages/ai-engine/README.md의 "환경 변수" 섹션 참고.
      # SUGGESTION_TOP_N: "10"
      # FAISS_CONTEXT_SIZE: "5"
      # COOCCURRENCE_HALF_LIFE_HOURS: "168"
      # COOCCURRENCE_SEED_SIZE: "3"
      # SUGGESTION_MIN_COUNT: "1"
      # SUGGESTION_MIN_LEN: "2"
      # SUGGESTION_MAX_LEN: "50"
      # SUGGESTION_BLOCKLIST_PATH: "/data/blocklist.txt"
      # SUGGESTION_GENERATED_MAX_SHARE: "0.3"
      # 실모델(E5/Qwen) 연결(전부 선택, 미설정 시 placeholder 유지). 이미지는
      # --extra models(sentence-transformers/llama-cpp-python)를 항상 포함하므로
      # 재빌드 없이 아래 값만 채우면 된다. 다른 sentence-transformers 모델이나
      # 다른 GGUF 모델로 바꾸고 싶을 때도 이미지를 다시 빌드할 필요 없이 값만
      # 바꾸면 된다. 상세 설명은 packages/ai-engine/README.md의 "환경 변수"/
      # "로드맵" 섹션 참고.
      # EMBEDDING_PROVIDER: "e5"                 # hashing(기본) | e5
      # E5_MODEL_NAME: "intfloat/multilingual-e5-small"
      # KEYWORD_GENERATOR_PROVIDER: "qwen"        # noop(기본) | qwen
      # QWEN_MODEL_PATH: "/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
      # QWEN_N_CTX: "512"
      # QWEN_MAX_TOKENS: "64"
    volumes:
      - duckdb-data:/data
      # GGUF 모델 파일을 직접 다운로드해 올려두는 자리 (자동 다운로드는 하지
      # 않는다 - packages/ai-engine/README.md "로드맵" 참고).
      - ./models:/models
      # E5 가중치(약 470MB) 캐시. 없으면 컨테이너 재시작마다 다시 받는다.
      - hf-cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

volumes:
  duckdb-data:
  hf-cache:
