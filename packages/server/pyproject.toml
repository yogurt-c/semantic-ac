[project]
name = "search-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hyungi", email = "hy46@tardistechnology.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.140.0",
    "redis>=8.0.1",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=search_server --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/search_server"]
branch = true
