[project]
name = "ai-engine"
version = "0.1.0"
description = "비동기 AI 배치 엔진 - 검색 이벤트 기반 자동완성 사전 생성 (트랙 C)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
models = [
    "sentence-transformers>=3.0.0",
    "llama-cpp-python>=0.2.90",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.23.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ai_engine --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/ai_engine"]
