services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  search-server:
    build:
      context: ./packages/server
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /data/search_events.duckdb
      # 자사 서비스에 붙일 때는 프런트엔드 도메인으로 좁혀서 지정할 것
      # (예: https://shop.example.com,https://m.shop.example.com)
      ALLOWED_ORIGINS: "*"
    volumes:
      - duckdb-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/suggest?q=healthcheck')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # 트랙 C: 상시 서빙 경로와 리소스 경합 없이 주기적으로 실행되는 원샷 배치 워커
  # (TODO.md 0번 결정). 실모델(E5/Qwen) 연결 전까지는 HashingEmbeddingModel/
  # NoopKeywordGenerator placeholder로 파이프라인 구조만 검증한다.
  ai-worker:
    build:
      context: ./packages/ai-engine
    environment:
      REDIS_URL: redis://redis:6379/0
      DUCKDB_PATH: /data/search_events.duckdb
      INDEX_PATH: /data/faiss/index.faiss
      BATCH_INTERVAL_SECONDS: "60"
      # 추천 생성 방식 튜닝(전부 선택, 미설정 시 코드 기본값 사용). 상세 설명은
      # packages/ai-engine/README.md의 "환경 변수" 섹션 참고.
      # SUGGESTION_TOP_N: "10"
      # FAISS_CONTEXT_SIZE: "5"
      # COOCCURRENCE_HALF_LIFE_HOURS: "168"
      # COOCCURRENCE_SEED_SIZE: "3"
    volumes:
      - duckdb-data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

volumes:
  duckdb-data:
